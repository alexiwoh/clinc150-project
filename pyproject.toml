[project]
name = "clinc150-project"
version = "0.1.0"
description = "Intent classification and out-of-scope detection on CLINC150 using PyTorch"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "datasets",
  "scikit-learn",
  "pandas",
  "numpy",
  "matplotlib",
  "tqdm",
  "jupyter",
  "ipykernel",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
addopts = "-m 'not network and not generated_artifacts'"
markers = [
  "network: downloads the public benchmark and needs network access or an existing cache",
  "generated_artifacts: validates saved experiment outputs and requires trained checkpoints for bundle checks",
]
